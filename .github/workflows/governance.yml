name: governed-workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test server/src/governance/tests/*.test.cjs
      - run: node --check server/src/index.js && node --check server/src/governance/router.cjs && node --check server/src/governance/domain.cjs
      - run: bash -n start.sh
